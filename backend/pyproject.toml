[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematic-video-studio-backend"
version = "1.0.0"
description = "Cinematic Multi-Language Video Studio - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Cinematic Video Studio Team", email = "team@cinematicvideostudio.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "asyncio-throttle>=1.0.2",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
    "python-json-logger>=2.0.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
]
ai = [
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "diffusers>=0.28.0",
    "accelerate>=0.30.0",
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "fasttext>=0.9.2",
    "TTS>=0.22.0",
    "audiocraft>=1.0.0",
    "bitsandbytes>=0.43.0",
    "xformers>=0.0.27",
]
all = [
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "diffusers>=0.28.0",
    "accelerate>=0.30.0",
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "fasttext>=0.9.2",
    "TTS>=0.22.0",
    "audiocraft>=1.0.0",
    "bitsandbytes>=0.43.0",
    "xformers>=0.0.27",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/cinematicvideostudio/backend"
Repository = "https://github.com/cinematicvideostudio/backend"
Issues = "https://github.com/cinematicvideostudio/backend/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "S106"],  # allow assert and hardcoded passwords in tests
}

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  \\.git
  | \\.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "app.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]